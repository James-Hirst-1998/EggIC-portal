<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shark Trust — Egg Case Identifier</title>
<meta name="description" content="Identify which of nine UK shark, skate and ray species laid an egg case, from a single photograph. Every answer comes with a confidence.">
<meta name="theme-color" content="#08807f">
<link rel="icon" href="/assets/shark_trust.png">
<link rel="apple-touch-icon" href="/assets/shark_trust.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shark Trust">
<meta property="og:title" content="Egg Case Identifier">
<meta property="og:description" content="Identify which of nine UK shark, skate and ray species laid an egg case, from a single photograph.">
<meta property="og:image" content="/assets/shark_trust.png">
<meta name="twitter:card" content="summary">
<script src="/analytics.js"></script>
<style>
  /* Light is the default; the toggle stamps data-theme="dark" on <html>. */
  :root {
    --bg:#ffffff; --panel:#f5f7f7; --fg:#101d1c; --dim:#5c6b69;
    --line:#e2e7e6; --accent:#08807f; --accent-soft:#e8f3f2; --amber:#8a5d00;
    --bad:#a8342a; --plate:#ffffff; --ring:rgba(8,128,127,.35);
    /* Solid fills for selected buttons — the theme accents are too light for white text. */
    --accent-solid:#08807f; --bad-solid:#a8342a;
  }
  :root[data-theme="dark"] {
    --bg:#0d1312; --panel:#151c1b; --fg:#e7ecea; --dim:#94a3a1; --line:#242f2d;
    --accent:#54bcb9; --accent-soft:#112b2a; --amber:#d8a63a; --bad:#e08b83;
    --plate:#ffffff; --ring:rgba(84,188,185,.4);
    --accent-solid:#0d6f6d; --bad-solid:#9d332a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  a { color: var(--accent); }

  /* ---------- header ---------- */
  header {
    flex: none; display: flex; align-items: center; gap: 13px;
    padding: 10px 22px; border-bottom: 1px solid var(--line);
  }
  header .logo { height: 44px; width: auto; background: var(--plate);
                 border-radius: 5px; padding: 3px; flex: none; }
  .brand { display: flex; flex-direction: column; line-height: 1.25; }
  .brand .org { font-size: 11px; font-weight: 700; letter-spacing: .13em;
                text-transform: uppercase; color: var(--accent); }
  .brand h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header .grow { flex: 1; }
  #progress { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .hbtn {
    flex: none; background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; height: 32px; padding: 0 12px; cursor: pointer; font-size: 13px;
    display: grid; place-items: center;
  }
  .hbtn:hover { border-color: var(--accent); color: var(--accent); }
  #theme { width: 32px; padding: 0; font-size: 14px; }

  main { flex: 1; min-height: 0; padding: 18px 22px; }

  /* ---------- intro ---------- */
  #intro { height: 100%; display: grid; place-items: center; }
  #intro .inner { width: min(620px, 100%); text-align: center; }
  .lede { font-size: 21px; line-height: 1.4; font-weight: 500; letter-spacing: -.012em;
          margin: 0 0 8px; }
  .lede-sub { font-size: 14px; color: var(--dim); margin: 0 0 24px; }
  #drop {
    display: block; width: 100%; border: 1.5px dashed var(--line); border-radius: 16px;
    padding: 34px 24px; cursor: pointer; background: var(--panel);
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { display: block; font-size: 17px; font-weight: 600; margin-bottom: 5px; }
  #drop span { display: block; font-size: 13px; color: var(--dim); }
  #drop .formats { font-size: 12px; margin-top: 7px; opacity: .8; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
  .fact { border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px;
          background: var(--bg); }
  .fact .big { font-size: 20px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
  .fact .cap { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .more { margin-top: 18px; font-size: 13.5px; }
  #error { display: none; color: var(--bad); font-size: 13.5px; margin-top: 12px; }
  input[type=file] { display: none; }

  /* ---------- review ---------- */
  #review { display: none; height: 100%; grid-template-columns: minmax(0,1.1fr) minmax(330px,.9fr);
            gap: 24px; }
  #review.show { display: grid; }

  .stage { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; }

  .filebar { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .filebar .fname {
    font: 600 14.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .filebar .of { font-size: 12.5px; color: var(--dim); flex: none;
                 font-variant-numeric: tabular-nums; }

  /* Absolute fill is the only way the photo is guaranteed to fit both dimensions —
     max-height:100% inside a grid track sizes itself circularly and overflows. */
  .frame { position: relative; min-height: 0; border-radius: 14px;
           background: var(--panel); overflow: hidden; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%;
               object-fit: contain; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px;
         border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
         color: var(--fg); cursor: pointer; display: grid; place-items: center;
         font-size: 15px; opacity: .92; z-index: 2; }
  .nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav:disabled { opacity: .25; cursor: default; }
  .nav.prev { left: 10px; } .nav.next { right: 10px; }

  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px; flex: none; }
  .thumb { position: relative; width: 56px; height: 56px; border-radius: 9px; flex: none;
           background-size: cover; background-position: center; cursor: pointer;
           border: 2px solid transparent; outline: 1px solid var(--line); outline-offset: -1px; }
  .thumb.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .thumb .badge { position: absolute; right: -3px; bottom: -3px; width: 17px; height: 17px;
                  border-radius: 50%; display: grid; place-items: center; font-size: 10px;
                  font-weight: 700; color: #fff; border: 2px solid var(--bg); }
  .badge.ok { background: var(--accent-solid); } .badge.no { background: var(--bad-solid); }
  .badge.wait { background: var(--dim); } .badge.err { background: var(--bad-solid); }
  .thumb.pending { opacity: .5; }

  .panel { min-height: 0; overflow-y: auto; padding-right: 4px; }
  .verdict { border: 1px solid var(--line); border-left: 3px solid var(--dim);
             border-radius: 12px; padding: 15px 17px; margin-bottom: 16px; }
  .verdict.confident { background: var(--accent-soft); border-color: var(--accent-soft);
                       border-left-color: var(--accent); }
  .verdict .lead { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
                   color: var(--dim); font-weight: 700; }
  .verdict .name { font-size: 25px; font-weight: 650; margin: 4px 0 1px; line-height: 1.15; }
  .verdict .latin { font-style: italic; color: var(--dim); font-size: 13.5px; }
  .verdict .note { font-size: 13px; color: var(--dim); margin-top: 9px; }

  h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       font-weight: 700; margin: 0 0 6px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px;
         padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .row .label { font-size: 14px; }
  .row .latin { font-style: italic; color: var(--dim); font-size: 12px; }
  .row .pct { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--dim);
              align-self: center; }
  .bar { grid-column: 1/-1; height: 3px; background: var(--line); border-radius: 2px; }
  .bar span { display: block; height: 100%; background: var(--dim); border-radius: 2px; }
  .row.top .bar span { background: var(--accent); }

  details { margin-top: 10px; }
  details summary { font-size: 13px; color: var(--accent); cursor: pointer; list-style: none;
                    padding: 5px 0; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }

  /* ---------- the egg cases: one card each, however many ---------- */
  #masks { position: absolute; inset: 0; width: 100%; height: 100%; }
  #masks .mask { cursor: pointer; }
  #masks polygon { fill: rgba(255,214,0,.16); stroke: #ffd600; stroke-width: 2;
                   vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  #masks .sel polygon { fill: rgba(255,214,0,.3); stroke-width: 3.5; }
  #masks circle { fill: var(--accent-solid); stroke: #fff; stroke-width: 2;
                  vector-effect: non-scaling-stroke; }
  #masks text { fill: #fff; font-weight: 700; text-anchor: middle; dominant-baseline: central;
                pointer-events: none; }
  .cases-head { display: flex; align-items: baseline; justify-content: space-between;
                gap: 10px; margin-bottom: 8px; }
  .cases-head h2 { margin: 0; }
  .linkbtn { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer;
             font-size: 12.5px; }
  .case { border: 1px solid var(--line); border-left: 3px solid var(--dim); border-radius: 12px;
          margin-bottom: 10px; }
  .case.confident { border-left-color: var(--accent); }
  .case.open { box-shadow: 0 0 0 3px var(--ring); }
  .case-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 8px; }
  .case-head { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
               background: none; border: none; padding: 0; color: inherit; cursor: pointer;
               text-align: left; font: inherit; }
  .case-head canvas { width: 52px; height: 52px; border-radius: 8px; flex: none;
                      background: var(--panel); }
  .case .num { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none;
               border-radius: 50%; background: var(--accent-solid); color: #fff;
               font-size: 12px; font-weight: 700; }
  .case .what { display: flex; flex-direction: column; min-width: 0; }
  .case .what .label { font-size: 16px; font-weight: 650; line-height: 1.2; }
  .case .what .sub { font-size: 12.5px; color: var(--dim); }
  .case.confident .what .sub { color: var(--accent); }
  .case .fbmark { font-size: 13px; font-weight: 700; flex: none; }
  .fbmark.yes { color: var(--accent); } .fbmark.no { color: var(--bad); }
  .eye { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--dim);
         border-radius: 8px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
  .eye.on { border-color: var(--accent); color: var(--accent); }
  .case-body { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
  .case-body .note { font-size: 13px; color: var(--dim); margin: 10px 0 12px; }
  .case-body .latin { font-style: italic; }

  .feedback { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
  .fb-buttons { display: flex; gap: 8px; }
  .fb-buttons button { flex: 1; padding: 9px 12px; border-radius: 9px; font-size: 13.5px;
                       border: 1px solid var(--line); background: var(--bg); color: var(--fg);
                       cursor: pointer; }
  .fb-buttons button:hover { border-color: var(--accent); }
  .fb-buttons button.on[data-correct="yes"] { background: var(--accent-solid);
                       border-color: var(--accent-solid); color: #fff; }
  .fb-buttons button.on[data-correct="no"] { background: var(--bad-solid);
                       border-color: var(--bad-solid); color: #fff; }
  .fb-buttons kbd { font: inherit; font-size: 11px; opacity: .6; margin-left: 4px; }
  .correction { display: none; margin-top: 12px; }
  .correction.show { display: block; }
  .correction label { display: block; font-size: 12.5px; font-weight: 600;
                      color: var(--dim); margin-bottom: 5px; }
  .correction select, .correction input { width: 100%; padding: 9px 10px; border-radius: 9px;
                  border: 1px solid var(--line); background: var(--bg);
                  color: var(--fg); font-size: 13.5px; }
  .correction select:focus, .correction input:focus { outline: 2px solid var(--ring);
                                              border-color: var(--accent); }
  .other-wrap { display: none; margin-top: 10px; }
  .other-wrap.show { display: block; }
  .fb-hint { font-size: 12px; color: var(--dim); margin-top: 9px; }

  .banner { flex: none; margin: 0 22px 10px; padding: 8px 13px; border-radius: 9px;
            font-size: 12.5px; border: 1px solid var(--amber); color: var(--amber);
            display: none; }
  .banner.show { display: block; }

  .spinner { width: 24px; height: 24px; border: 2.5px solid var(--line);
             border-top-color: var(--accent); border-radius: 50%;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .centered { display: grid; place-items: center; height: 100%; text-align: center;
              color: var(--dim); font-size: 13.5px; gap: 12px; }
  .wake-note { max-width: 34ch; font-size: 12.5px; line-height: 1.55; color: var(--dim);
               border-top: 1px solid var(--line); padding-top: 12px; }
  .wake-note strong { color: var(--fg); font-weight: 600; }
  .wake-fine { display: block; margin-top: 8px; font-size: 11px; line-height: 1.5;
               opacity: .75; }

  @media (max-width: 880px) {
    body { overflow: auto; }
    #review.show { grid-template-columns: 1fr; height: auto; }
    .stage { grid-template-rows: auto 52vh auto; }
    .panel { overflow: visible; }
  }
  .compare { margin:.9rem 0 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .compare .crow { display:flex; justify-content:space-between; gap:.5rem;
    padding:.45rem .6rem; font-size:.86rem; border-top:1px solid var(--line); }
  .compare .crow:first-child { border-top:0; background:var(--panel); font-weight:600; }
  .compare .cname { color:var(--dim); }
  .compare .agree { color:var(--ok, #1a7f37); }
  .compare .differ { color:var(--warn, #b25f00); font-weight:600; }
</style>
</head>
<body>

<header>
  <img class="logo" src="/assets/shark_trust.png" alt="Shark Trust" onerror="this.remove()">
  <div class="brand">
    <span class="org">Shark Trust</span>
    <h1>Egg Case Identifier</h1>
  </div>
  <div class="grow"></div>
  <span id="progress"></span>
  <button class="hbtn" id="restart" type="button" style="display:none">New batch</button>
  <button class="hbtn" id="theme" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
</header>

<div class="banner" id="banner"></div>

<main>
  <section id="intro">
    <div class="inner">
      <p class="lede">Identify which species laid an egg case, from a single photograph.</p>
      <p class="lede-sub">Trained on nine UK species. Every answer comes with a confidence.</p>

      <label id="drop" for="file">
        <strong>Drop egg case photos here</strong>
        <span>or click to choose — up to <span id="batch-cap">20</span> at a time</span>
        <span class="formats">JPEG, PNG, HEIC and WebP. Photographs only, not video.</span>
      </label>
      <!-- iPhone photos are .heic, and neither Windows nor Android reliably map that
           extension to an image/* type, so both must be named explicitly. -->
      <input type="file" id="file" multiple
             accept="image/*,.heic,.heif,.HEIC,.HEIF,.jpg,.jpeg,.png,.webp">

      <div class="facts">
        <div class="fact"><div class="big">9</div><div class="cap">species covered</div></div>
        <div class="fact"><div class="big">18,000</div><div class="cap">photographs learned from</div></div>
        <div class="fact"><div class="big">95%</div><div class="cap">confidence to accept a call</div></div>
      </div>

      <p class="more"><a href="/about">How the model works, and when to trust it →</a></p>
      <div id="error"></div>
    </div>
  </section>

  <section id="review">
    <div class="stage">
      <div class="filebar">
        <span class="fname" id="fname"></span>
        <span class="of" id="of"></span>
      </div>
      <div class="frame">
        <img id="preview" alt="">
        <svg id="masks" preserveAspectRatio="xMidYMid meet"></svg>
        <button class="nav prev" id="prev" type="button" aria-label="Previous">‹</button>
        <button class="nav next" id="next" type="button" aria-label="Next">›</button>
      </div>
      <div class="strip" id="strip"></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </section>
</main>

<script>
// analytics.js defines the real one. A tracker blocker can stop it loading, and
// that must not take the identifier down with it.
window.track = window.track || function () {};

const $ = id => document.getElementById(id);
const MAX_BATCH = 20;
const MAX_BYTES = 30 * 1024 * 1024;   // a 30MB photograph is a mistake, not a submission
// The cap is quoted in the drop zone; read it from the constant so the two cannot drift.
$('batch-cap').textContent = MAX_BATCH;

// Alphabetical and fixed, so the correction list does not reshuffle per photo.
const SPECIES = [
  {key: 'BlondeRay',            name: 'Blonde Ray',            latin: 'Raja brachyura'},
  {key: 'CuckooRay',            name: 'Cuckoo Ray',            latin: 'Leucoraja naevus'},
  {key: 'FlapperSkate',         name: 'Flapper Skate',         latin: 'Dipturus intermedius'},
  {key: 'Nursehound',           name: 'Nursehound',            latin: 'Scyliorhinus stellaris'},
  {key: 'SmallEyedRay',         name: 'Small-eyed Ray',        latin: 'Raja microocellata'},
  {key: 'SmallSpottedCatshark', name: 'Small-spotted Catshark', latin: 'Scyliorhinus canicula'},
  {key: 'SpottedRay',           name: 'Spotted Ray',           latin: 'Raja montagui'},
  {key: 'ThornbackRay',         name: 'Thornback Ray',         latin: 'Raja clavata'},
  {key: 'UndulateRay',          name: 'Undulate Ray',          latin: 'Raja undulata'},
];

/* The Shark Trust's NW Europe eggcase guide covers thirteen species: the nine above
   and these four. The model has no class for them, so it can only ever answer one of
   the nine — a recorder who finds a Blue Skate has to be able to say so, or the
   correction is lost as "wrong" with nothing attached to it. */
const OTHER_SPECIES = [
  {key: 'BlackmouthCatshark', name: 'Blackmouth Catshark', latin: 'Galeus melastomus'},
  {key: 'BlueSkate',          name: 'Blue Skate',          latin: 'Dipturus batis'},
  {key: 'StarrySkate',        name: 'Starry Skate',        latin: 'Amblyraja radiata'},
  {key: 'WhiteSkate',         name: 'White Skate',         latin: 'Rostroraja alba'},
];
// Everything the guide does not cover — a species from further afield, an eggcase too
// worn to name — is typed in rather than forced onto the nearest name on the list.
const OTHER_KEY = '__other__';

const drop = $('drop'), fileInput = $('file'), intro = $('intro'), review = $('review');
let items = [];  // {name, file, dataUrl, state, result, error,
                 //  sel: the open egg case, hidden: case numbers whose mask is off,
                 //  fb / stored / storedReason: keyed by case number}
let current = 0;
let firstDone = false;   // once one result is back, the model is awake
let coldRetryUsed = false;  // the single cold-start retry, spent at most once a session

/* ---------- theme ---------- */
if (localStorage.getItem('eggic-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
$('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  if (dark) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = 'dark';
  localStorage.setItem('eggic-theme', dark ? 'light' : 'dark');
  track('theme_toggled', {to: dark ? 'light' : 'dark'});
});

$('restart').addEventListener('click', () => {
  track('new_batch_clicked', {
    reviewed: items.filter(i => cases(i).some(c => fbOf(i, c.n).correct !== null)).length,
    of: items.length,
  });
  items = []; current = 0;
  fileInput.value = '';
  review.classList.remove('show');
  intro.style.display = 'grid';
  $('banner').classList.remove('show');
  $('progress').textContent = '';
  $('restart').style.display = 'none';
});

/* ---------- what counts as a photograph ----------
   Sorting on file.type alone is not safe: Windows and several Android builds hand
   over HEIC with an empty type, and Finder gives .mov a type only sometimes. Each
   test therefore takes the MIME type or the extension, whichever is available. */
const HEIC_EXT  = /\.(heic|heif)$/i;
const IMAGE_EXT = /\.(jpe?g|png|webp|gif|bmp|avif|tiff?|heic|heif)$/i;
const VIDEO_EXT = /\.(mov|mp4|m4v|avi|mkv|webm|3gp|3g2|mpe?g|wmv|flv|hevc)$/i;

const isHeic  = f => HEIC_EXT.test(f.name) || /^image\/hei[cf]/.test(f.type);
const isVideo = f => f.type.startsWith('video/') || VIDEO_EXT.test(f.name);
const isImage = f => !isVideo(f) && (f.type.startsWith('image/') || IMAGE_EXT.test(f.name));

/* ---------- input ---------- */
drop.addEventListener('dragenter', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', e => {
  if (!drop.contains(e.relatedTarget)) drop.classList.remove('over');
});
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  // Everything dropped is passed on, so anything unusable can be named rather
  // than silently disappearing.
  accept([...e.dataTransfer.files], 'drop');
});
// Without this the browser navigates away to any photo dropped outside the target.
['dragover', 'drop'].forEach(evt => window.addEventListener(evt, e => e.preventDefault()));
fileInput.addEventListener('change', () => accept([...fileInput.files], 'picker'));

document.addEventListener('keydown', e => {
  if (!review.classList.contains('show')
      || ['SELECT', 'INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') go(current - 1);
  else if (e.key === 'ArrowRight') go(current + 1);
  else if (e.key.toLowerCase() === 'y') mark(true);
  else if (e.key.toLowerCase() === 'n') mark(false);
});

const names = list => list.map(f => f.name).join(', ');

function accept(files, source) {
  const err = $('error');
  err.style.display = 'none';
  if (!files.length) return;

  const videos  = files.filter(isVideo);
  const photos  = files.filter(isImage);
  const oddball = files.filter(f => !isVideo(f) && !isImage(f));
  const huge    = photos.filter(f => f.size > MAX_BYTES);
  const usable  = photos.filter(f => f.size <= MAX_BYTES);

  track('files_selected', {
    source, chosen: files.length, usable: usable.length,
    videos: videos.length, oversize: huge.length, unsupported: oddball.length,
    heic: usable.filter(isHeic).length,
    largest_mb: +(Math.max(0, ...files.map(f => f.size)) / 1048576).toFixed(1),
  });

  // Anything that cannot be identified is named, so a dropped clip or screenshot
  // does not just vanish with no explanation.
  const notes = [];
  if (videos.length) notes.push(
    `${videos.length === 1 ? 'A video was' : `${videos.length} videos were`} skipped ` +
    `(${names(videos)}). The model reads still photographs only — take a screenshot ` +
    `of the clearest frame and upload that.`);
  if (oddball.length) notes.push(
    `Not a photograph, so skipped: ${names(oddball)}.`);
  if (huge.length) notes.push(
    `Too large to upload (over ${MAX_BYTES / 1048576}MB): ${names(huge)}.`);

  if (!usable.length) {
    err.textContent = notes.join(' ') || 'No photographs found in that selection.';
    err.style.display = 'block';
    $('banner').classList.remove('show');
    fileInput.value = '';
    track('files_rejected', {source, videos: videos.length, unsupported: oddball.length,
                             oversize: huge.length});
    return;
  }

  // The file picker has no way to cap selection, so the cap is enforced here and
  // the dropped extras are named rather than silently vanishing.
  if (usable.length > MAX_BATCH) {
    const extra = usable.slice(MAX_BATCH);
    notes.unshift(
      `${usable.length} photos selected — testing the first ${MAX_BATCH}, ` +
      `${extra.length} not uploaded (${names(extra)}). ` +
      `${MAX_BATCH} at a time is a limit of this testing build, not the model.`);
  }

  const banner = $('banner');
  banner.textContent = notes.join(' ');
  banner.classList.toggle('show', notes.length > 0);

  items = usable.slice(0, MAX_BATCH).map(f => ({
    name: f.name, file: f, dataUrl: null, state: 'queued',
    ready: null, converting: false, prepError: null,
    result: null, error: null, sel: 0, hidden: new Set(), fb: {}, stored: {}, storedReason: {},
  }));
  current = 0;
  intro.style.display = 'none';
  review.classList.add('show');
  $('restart').style.display = 'grid';
  renderAll();
  runBatch();
}

/* The model sees 448px, so sending a 12MP original only makes the user wait on
   their own upload bandwidth. */
function downscale(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const max = 1024, scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Not a readable image.')); };
    img.src = url;
  });
}

/* Safari and every iOS browser decode HEIC themselves; Chrome, Firefox and Edge
   do not, so those get a decoder — 3MB, fetched once, and only when a HEIC
   actually turns up. It decodes in a worker, so the page stays responsive
   through what is several seconds of work on a 12-megapixel photo. */
let heicLoader = null;
function loadHeicDecoder() {
  if (!heicLoader) {
    heicLoader = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '/vendor/heic-to.js';
      s.onload = () => window.HeicTo
        ? resolve(window.HeicTo)
        : reject(new Error('decoder loaded but exported nothing'));
      s.onerror = () => { heicLoader = null; reject(new Error('decoder script failed to load')); };
      document.head.appendChild(s);
    });
  }
  return heicLoader;
}

/* Native decode first, so Safari and every ordinary JPEG take the fast path and
   never pay for the converter. */
async function prepare(item) {
  try {
    return await downscale(item.file);
  } catch (err) {
    if (!isHeic(item.file)) throw err;
  }

  item.converting = true;
  updateProgress(); renderStrip();
  if (items[current] === item) renderPanel();

  const started = performance.now();
  try {
    const heicTo = await loadHeicDecoder();
    const jpeg = await heicTo({blob: item.file, type: 'image/jpeg', quality: 0.92});
    const dataUrl = await downscale(jpeg);
    track('heic_converted', {ok: true, ms: Math.round(performance.now() - started),
                             source_mb: +(item.file.size / 1048576).toFixed(1)});
    return dataUrl;
  } catch (err) {
    track('heic_converted', {ok: false, ms: Math.round(performance.now() - started),
                             reason: String(err && err.message || err).slice(0, 120)});
    throw new Error('This iPhone photo (HEIC) could not be converted. On the iPhone, ' +
                    'Settings › Camera › Formats › "Most Compatible" saves as JPEG instead.');
  } finally {
    item.converting = false;
  }
}

/* The serverless hop is capped at 60 seconds and a Modal cold start has been
   measured at 58, so a request killed mid-flight is a real outcome — and what comes
   back then is the platform's own plain-text error page, not JSON. Parsing before
   checking the status turned that into "Unexpected token 'A'"; read the body once
   and report something a person can act on. */
async function callPredict(item) {
  const res = await fetch('/api/predict', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({image: item.dataUrl, filename: item.name, ...modelChoice()}),
  });
  const body = await res.text();
  let data = null;
  try { data = JSON.parse(body); } catch (e) { /* a platform error page, not a result */ }
  if (data && res.ok) return data;
  throw new Error((data && data.error) || (res.ok
    ? 'The model’s reply did not arrive intact.'
    : res.status >= 500
      ? `The model did not answer in time (HTTP ${res.status}) — it may still have been waking up.`
      : `The request was refused (HTTP ${res.status}).`));
}

/* One at a time: the model serves one request at a time anyway, and results appear
   as they land so review can start on the first photo immediately.

   Preparing a photo and identifying it run as two separate serial queues, so a
   HEIC conversion — several seconds — overlaps the previous photo's round trip
   instead of following it. Each queue still handles one photo at a time: the
   decoder has a single worker, and the model a single container. */
async function runBatch() {
  const batchStarted = performance.now();
  let ok = 0, failed = 0;
  track('batch_started', {size: items.length, heic: items.filter(i => isHeic(i.file)).length});
  updateProgress();

  let queue = Promise.resolve();
  for (const item of items) {
    // Failures are recorded rather than thrown, so one bad photo does not stall
    // the queue behind it.
    item.ready = queue = queue.then(() => prepare(item).then(
      url => {
        item.dataUrl = url;
        renderStrip();
        if (items[current] === item) showPhoto();
      },
      err => { item.prepError = err; },
    ));
  }

  for (const [i, item] of items.entries()) {
    const cold = !firstDone;
    let started = performance.now();
    let stage = 'prepare';
    try {
      await item.ready;
      if (item.prepError) throw item.prepError;
      item.state = 'running';
      updateProgress(); renderStrip(); if (i === current) { showPhoto(); renderPanel(); }
      // Timed from here, so the figure is the model's round trip and not the
      // seconds a HEIC conversion may have added in front of it.
      stage = 'predict';
      started = performance.now();
      // The first call of a session waits on the GPU waking, which can outlast the
      // 60s ceiling in front of it. The container is warm by the time the failure
      // lands here, so one retry returns the answer the model already computed.
      let data;
      try {
        data = await callPredict(item);
      } catch (err) {
        if (firstDone || coldRetryUsed) throw err;
        coldRetryUsed = true;
        track('predict_retried', {reason: String(err.message).slice(0, 120),
                                  ms: Math.round(performance.now() - started)});
        started = performance.now();
        data = await callPredict(item);
      }
      item.result = data; item.state = 'done'; firstDone = true; ok++;
      const first = data.cases[0];
      track('prediction_succeeded', {
        cases: data.count, segmenter: data.segmenter.status,
        identified: data.cases.filter(c => c.confident).length,
        species: first ? first.top_name : 'none', confidence: first ? +first.confidence.toFixed(3) : null,
        ms: Math.round(performance.now() - started),
        cold_start: cold, position: i + 1, batch_size: items.length,
        heic: isHeic(item.file),
      });
    } catch (err) {
      item.error = err.message; item.state = 'error'; failed++;
      track('prediction_failed', {
        stage, reason: String(err.message).slice(0, 200), cold_start: cold,
        ms: Math.round(performance.now() - started),
        position: i + 1, batch_size: items.length, heic: isHeic(item.file),
      });
    }
    updateProgress(); renderStrip(); if (i === current) { showPhoto(); renderPanel(); }
  }
  updateProgress();
  track('batch_completed', {size: items.length, succeeded: ok, failed,
                            ms: Math.round(performance.now() - batchStarted)});
}

function updateProgress() {
  const busy = items.findIndex(i => i.state !== 'done' && i.state !== 'error');
  $('progress').textContent = busy === -1
    ? (items.length > 1 ? `${items.length} photos` : '')
    : `Identifying ${busy + 1} of ${items.length}…`;
}

/* ---------- navigation ---------- */
function go(i) {
  if (i < 0 || i >= items.length) return;
  current = i;
  renderAll();
}
$('prev').addEventListener('click', () => go(current - 1));
$('next').addEventListener('click', () => go(current + 1));

function renderAll() { showPhoto(); renderStrip(); renderPanel(); }

// Every reply is a list of egg cases, empty when there is none: one is the same as five.
const cases = item => item.result ? item.result.cases : [];
const fbOf = (item, n) => item.fb[n] ||= {correct: null, label: null, otherText: null};
const pct = p => Math.round(p * 100);

function h(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.includes('-')) node.setAttribute(k, v); else node[k] = v;
  }
  node.append(...kids.filter(k => k != null && k !== false));
  return node;
}

function showPhoto() {
  const item = items[current];
  $('preview').src = item.dataUrl || '';
  $('preview').alt = item.name;
  $('fname').textContent = item.name;
  $('of').textContent = items.length > 1 ? `${current + 1} of ${items.length}` : '';
  $('prev').disabled = current === 0;
  $('next').disabled = current === items.length - 1;
  const single = items.length < 2;
  $('prev').style.display = $('next').style.display = single ? 'none' : 'grid';
  $('strip').style.display = single ? 'none' : 'flex';
  drawMasks();
}

/* Each egg case's outline over the photo, in the photo's own pixels. The SVG letterboxes
   exactly as the img's object-fit: contain does, so the two always line up. */
const SVG = 'http://www.w3.org/2000/svg';
function svg(tag, attrs) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}
function drawMasks() {
  const layer = $('masks'), img = $('preview'), item = items[current];
  layer.replaceChildren();
  const w = img.naturalWidth, ht = img.naturalHeight;
  if (!item || !w || !img.src) return;
  layer.setAttribute('viewBox', `0 0 ${w} ${ht}`);
  const r = Math.max(w, ht) / 42;
  cases(item).forEach((c, i) => {
    if (!c.outline || item.hidden.has(c.n)) return;
    const g = svg('g', {class: i === item.sel ? 'mask sel' : 'mask'});
    for (const poly of c.outline)
      g.append(svg('polygon', {points: poly.map(([x, y]) => `${x * w},${y * ht}`).join(' ')}));
    const [x0, y0, x1, y1] = c.box;
    const cx = (x0 + x1) / 2 * w, cy = (y0 + y1) / 2 * ht;
    const label = svg('text', {x: cx, y: cy, 'font-size': r * 1.15});
    label.textContent = c.n;
    g.append(svg('circle', {cx, cy, r}), label);
    g.addEventListener('click', () => select(i));
    layer.append(g);
  });
}
$('preview').addEventListener('load', drawMasks);

// Filenames come from the user's disk and land in an attribute, so they are escaped.
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function badgeOf(item) {
  if (item.state === 'error') return '<div class="badge err">!</div>';
  if (item.state !== 'done') return '<div class="badge wait">·</div>';
  const said = cases(item).map(c => fbOf(item, c.n).correct);
  if (said.includes(false)) return '<div class="badge no">✕</div>';
  if (said.length && said.every(v => v === true)) return '<div class="badge ok">✓</div>';
  return '';
}

function renderStrip() {
  $('strip').innerHTML = items.map((item, i) =>
    `<div class="thumb${i === current ? ' active' : ''}${item.state === 'done' ? '' : ' pending'}"
          data-i="${i}" title="${esc(item.name)}"
          style="background-image:url('${item.dataUrl || ''}')">${badgeOf(item)}</div>`).join('');
  [...$('strip').children].forEach(el =>
    el.addEventListener('click', () => go(+el.dataset.i)));
}

/* ---------- result panel ---------- */
// Both models always run and their answers are averaged — that pairing is what the
// held-out evaluation favours. ?compare=1 exposes the individual arms for testing.
const COMPARE = new URLSearchParams(location.search).has('compare');
// No arm names here: Modal runs every arm it loaded, so a model swap needs no page change.
function modelChoice() {
  return {primary: 'ensemble'};
}

const MODEL_LABEL = {s2_dinov2: 'DINOv2', s2_dinov3: 'DINOv3', ensemble: 'Both, averaged'};

// An answer that is not one of the nine says what to do instead.
const SPECIAL = {
  RareSpecies: {lead: 'Possibly a rare species',
                note: 'Send this photograph to the Shark Trust for an expert to check.'},
};

function compareBlock(c) {
  const by = c.by_model || {};
  const arms = Object.keys(by).filter(m => m !== 'ensemble');
  if (!COMPARE || arms.length < 2) return null;
  const agree = arms.every(m => by[m].top === by[arms[0]].top);
  return h('div', {},
    h('h2', {textContent: agree ? 'Both models agree' : 'The models disagree'}),
    h('div', {className: 'compare'}, ...['ensemble', ...arms].filter(m => by[m]).map(m =>
      h('div', {className: 'crow'},
        h('span', {className: 'cname', textContent: MODEL_LABEL[m] || m}),
        h('span', {className: m === 'ensemble' ? '' : by[m].top === by.ensemble.top ? 'agree' : 'differ',
                   textContent: `${by[m].top_name} · ${pct(by[m].confidence)}%`})))));
}

function scoreRow(r, isTop) {
  const p = (r.prob * 100).toFixed(1);
  const bar = h('span');
  bar.style.width = `${p}%`;
  return h('div', {className: isTop ? 'row top' : 'row'},
    h('div', {}, h('div', {className: 'label', textContent: r.name}),
                 h('div', {className: 'latin', textContent: r.latin})),
    h('div', {className: 'pct', textContent: `${p}%`}),
    h('div', {className: 'bar'}, bar));
}

/* A small square of the photo around one egg case, cut in the browser from the photo
   already on screen, so the reply carries no pictures. */
function cropThumb(src, box) {
  const c = h('canvas', {width: 104, height: 104});
  const img = new Image();
  img.onload = () => {
    const [x0, y0, x1, y1] = box || [0, 0, 1, 1];
    const side = Math.max((x1 - x0) * img.width, (y1 - y0) * img.height) * 1.08;
    c.getContext('2d').drawImage(img, (x0 + x1) / 2 * img.width - side / 2,
      (y0 + y1) / 2 * img.height - side / 2, side, side, 0, 0, c.width, c.height);
  };
  img.src = src;
  return c;
}

function renderPanel() {
  const item = items[current];
  const panel = $('panel');

  if (item.state === 'error') {
    panel.replaceChildren(h('div', {className: 'centered'}, h('div', {},
      h('p', {style: 'color:var(--bad)', textContent: 'Could not identify this photo.'}),
      h('p', {textContent: item.error}))));
    return;
  }
  if (item.state !== 'done') {
    const label = item.converting          ? 'Converting from your iPhone’s HEIC…'
                : item.state === 'running' ? 'Identifying…'
                : 'Queued';
    // The model sleeps when unused, so the first call of a session waits on it
    // waking. Saying so up front stops it reading as a hang.
    const wake = !firstDone && item.state === 'running' && !item.converting
      && h('div', {className: 'wake-note'},
        h('strong', {textContent: 'The first photograph in a batch can take up to a minute'}),
        ' while the model wakes up. Every photograph after it comes back in a few seconds.',
        h('span', {className: 'wake-fine', textContent: 'This demo runs on hardware that sleeps ' +
          'when nobody is using it, to keep costs down. Deployed in-house, the wait disappears entirely.'}));
    panel.replaceChildren(h('div', {className: 'centered'},
      h('div', {className: 'spinner'}), h('div', {textContent: label}), wake));
    return;
  }

  const d = item.result;
  if (!d.cases.length) {
    panel.replaceChildren(h('div', {className: 'verdict'},
      h('div', {className: 'lead', textContent: 'No egg case found'}),
      h('div', {className: 'note', textContent:
        `${pct(d.no_egg_case)}% sure there is no egg case in this photo. ` +
        'Try a closer photograph of a single egg case.'})));
    return;
  }

  const outlined = d.cases.filter(c => c.outline);
  const anyShown = outlined.some(c => !item.hidden.has(c.n));
  const all = outlined.length > 1 && h('button', {type: 'button', className: 'linkbtn',
    textContent: anyShown ? 'Hide all masks' : 'Show all masks'});
  if (all) all.addEventListener('click', () => {
    item.hidden = new Set(anyShown ? outlined.map(c => c.n) : []);
    track('masks_toggled', {all: true, shown: !anyShown, cases: d.count});
    renderPanel(); drawMasks();
  });
  panel.replaceChildren(
    h('div', {className: 'cases-head'},
      h('h2', {textContent: d.count === 1 ? '1 egg case in this photo' : `${d.count} egg cases in this photo`}),
      all),
    ...d.cases.map((c, i) => caseCard(item, c, i)));
  showHint(item);
}

function caseCard(item, c, i) {
  const open = i === item.sel, fb = fbOf(item, c.n);
  const special = c.confident && SPECIAL[c.top];
  const head = h('button', {type: 'button', className: 'case-head', 'aria-expanded': String(open)},
    h('span', {className: 'num', textContent: c.n}),
    cropThumb(item.dataUrl, c.box),
    h('span', {className: 'what'},
      h('span', {className: 'label', textContent: special ? special.lead : c.top_name}),
      h('span', {className: 'sub', textContent:
        `${c.confident ? 'Identified' : 'Best guess only'} · ${pct(c.confidence)}%`})));
  head.addEventListener('click', () => select(i));

  const shown = c.outline && !item.hidden.has(c.n);
  const eye = c.outline && h('button', {type: 'button', className: shown ? 'eye on' : 'eye',
    'aria-pressed': String(!!shown), textContent: shown ? 'Hide mask' : 'Show mask'});
  if (eye) eye.addEventListener('click', () => toggleMask(item, c));
  const mark = fb.correct !== null && h('span', {className: fb.correct ? 'fbmark yes' : 'fbmark no',
    textContent: fb.correct ? '✓' : '✕', title: fb.correct ? 'Marked correct' : 'Marked not correct'});

  const card = h('section', {className: `case${c.confident ? ' confident' : ''}${open ? ' open' : ''}`},
    h('div', {className: 'case-top'}, head, mark, eye));
  if (!open) return card;

  const line = pct(item.result.threshold);
  const where = c.outline ? '' : ' Named from the whole photo.';
  const note = c.confident
    ? `${pct(c.confidence)}% confident, at or above the ${line}% line.${special ? ' ' + special.note : ''}${where}`
    : `${pct(c.confidence)}% confident, below the ${line}% line, so not called. ` +
      `Compare the scores below.${where}`;
  const rest = c.ranked.slice(3);
  const alts = h('details', {}, h('summary', {textContent: `Show the other ${rest.length}`}),
    h('div', {}, ...rest.map(r => scoreRow(r, false))));
  alts.addEventListener('toggle', () => {
    if (alts.open) track('alternatives_expanded', {species: c.top_name, confident: !!c.confident,
                                                   case: c.n, cases: item.result.count});
  });
  card.append(h('div', {className: 'case-body'},
    h('div', {className: 'latin note', textContent: c.ranked[0].latin}),
    h('div', {className: 'note', textContent: note}),
    compareBlock(c),
    h('h2', {textContent: 'Scores'}),
    h('div', {}, ...c.ranked.slice(0, 3).map((r, j) => scoreRow(r, j === 0))),
    alts,
    feedbackBlock(item, c, fb)));
  return card;
}

function select(i) {
  const item = items[current];
  if (i === item.sel) return;
  item.sel = i;
  track('case_opened', {case: i + 1, cases: item.result.count});
  renderPanel(); drawMasks();
}

function toggleMask(item, c) {
  if (item.hidden.has(c.n)) item.hidden.delete(c.n); else item.hidden.add(c.n);
  track('masks_toggled', {all: false, shown: !item.hidden.has(c.n), case: c.n, cases: item.result.count});
  renderPanel(); drawMasks();
}

function speciesGroup(label, list, fb) {
  return h('optgroup', {label}, ...list.map(sp =>
    h('option', {value: sp.key, selected: fb.label === sp.key, textContent: `${sp.name} — ${sp.latin}`})));
}

function feedbackBlock(item, c, fb) {
  const yes = h('button', {type: 'button', className: fb.correct === true ? 'on' : '', 'data-correct': 'yes'},
    'Correct', h('kbd', {textContent: 'Y'}));
  const no = h('button', {type: 'button', className: fb.correct === false ? 'on' : '', 'data-correct': 'no'},
    'Not correct', h('kbd', {textContent: 'N'}));
  yes.addEventListener('click', () => mark(true));
  no.addEventListener('click', () => mark(false));

  const sel = h('select', {id: 'true-species'},
    h('option', {value: '', textContent: 'Select a species…'}),
    speciesGroup('The nine the model knows', SPECIES, fb),
    speciesGroup('Also in the Shark Trust guide', OTHER_SPECIES, fb),
    h('option', {value: OTHER_KEY, selected: fb.label === OTHER_KEY,
                 textContent: 'Something else — type it in'}));
  const other = h('input', {id: 'other-species', type: 'text', autocomplete: 'off', spellcheck: false,
    placeholder: 'Species name, or whatever you can say about it', value: fb.otherText || ''});
  const otherWrap = h('div', {className: fb.label === OTHER_KEY ? 'other-wrap show' : 'other-wrap'},
    h('label', {htmlFor: 'other-species', textContent: 'What was it?'}), other);
  sel.addEventListener('change', () => {
    fb.label = sel.value || null;
    if (sel.value !== OTHER_KEY) fb.otherText = null;
    otherWrap.classList.toggle('show', sel.value === OTHER_KEY);
    renderStrip();
    // "Something else" is only half an answer — wait for the words before recording it.
    if (sel.value === OTHER_KEY) { other.focus(); return; }
    if (sel.value) recordCorrection(item, c);
  });
  // change, not input: fires on Enter or on leaving the field, so a half-typed name
  // is not saved and advanced past on every keystroke.
  other.addEventListener('change', () => {
    fb.otherText = other.value.trim() || null;
    renderStrip();
    if (fb.otherText) recordCorrection(item, c);
  });

  return h('div', {className: 'feedback'},
    h('h2', {textContent: item.result.count > 1 ? `Was egg case ${c.n} right?` : 'Was this right?'}),
    h('div', {className: 'fb-buttons'}, yes, no),
    h('div', {className: fb.correct === false ? 'correction show' : 'correction'},
      h('label', {htmlFor: 'true-species', textContent: 'Choose the correct species'}), sel, otherWrap),
    h('div', {className: 'fb-hint', id: 'fb-hint'}));
}

/* The select holds a key; "something else" holds whatever was typed. One reader for
   both, so the tracking, the strip and what reaches the database cannot disagree. */
function correctionValue(fb) {
  return fb.label === OTHER_KEY ? fb.otherText : fb.label;
}

function recordCorrection(item, c) {
  const value = correctionValue(fbOf(item, c.n));
  if (!value) return;
  track('correction_given', {
    predicted: c.top_name, corrected_to: value, confidence: +c.confidence.toFixed(3),
    case: c.n, cases: item.result.count,
    // A species the model has no class for is a different failure from confusing two
    // it does know, and only the first is a reason to widen the training set.
    off_list: !SPECIES.some(sp => sp.key === value),
    typed_in: fbOf(item, c.n).label === OTHER_KEY,
    // The most valuable signal in the whole test: which pairs the model confuses.
    confusion: `${c.top} → ${value}`,
  });
  sendFeedback(item, c);
  advance(item);
}

/* After an answer: the next unanswered egg case in this photo, else the next photo. */
function advance(item) {
  const next = cases(item).findIndex((c, i) => i > item.sel && fbOf(item, c.n).correct === null);
  setTimeout(() => {
    if (items[current] !== item) return;
    if (next !== -1) select(next);
    else if (current < items.length - 1) go(current + 1);
  }, 250);
}

function showHint(item) {
  const hint = $('fb-hint'), c = cases(item)[item.sel];
  if (!hint || !c) return;
  const stored = item.stored[c.n];
  if (fbOf(item, c.n).correct === null) hint.textContent = '';
  else if (stored === true) hint.textContent = 'Saved.';
  else if (stored === false) hint.textContent = `Not saved — ${item.storedReason[c.n] || 'no submission on record'}.`;
  else hint.textContent = 'Saving…';
}

function mark(correct) {
  const item = items[current], c = cases(item)[item.sel];
  if (item.state !== 'done' || !c) return;
  const fb = fbOf(item, c.n);
  fb.correct = correct;
  // "Correct" is self-describing; "not correct" waits for the species picker.
  fb.label = correct ? c.top : null;
  fb.otherText = null;
  renderStrip(); renderPanel();
  track('feedback_given', {correct, predicted: c.top_name, confidence: +c.confidence.toFixed(3),
                           confident: !!c.confident, case: c.n, cases: item.result.count});
  sendFeedback(item, c);
  if (correct) advance(item);
  else $('true-species').focus();
}

async function sendFeedback(item, c) {
  const fb = fbOf(item, c.n);
  item.stored[c.n] = undefined;
  showHint(item);
  try {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: item.result.id, n: c.n, correct: fb.correct,
                            user_species: correctionValue(fb)}),
    });
    const data = await res.json();
    item.stored[c.n] = !!data.stored;
    item.storedReason[c.n] = data.reason || data.error || null;
  } catch (err) {
    item.stored[c.n] = false;
    item.storedReason[c.n] = err.message;
  }
  if (items[current] === item) showHint(item);
}
</script>
</body>
</html>
